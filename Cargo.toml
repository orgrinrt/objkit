[workspace]
members = ["objkit-macros"]

[workspace.package]
version = "0.0.2"
edition = "2021"
# 1.64.0 builds this crate's own source, and quote 1.0.47 does not, so 1.71 is where a
# fresh resolve actually works. The lower number held only for a build resolving against
# an existing lock file, which is not what a new consumer does.
rust-version = "1.71"

[workspace.dependencies]
proc-macro2 = { version = "^1.0" }
quote = { version = "^1.0", features = ["proc-macro"] }
syn = { version = "^2.0.0", features = ["full"] }
include_proc_macro = "2.0.6"
objkit-macros = { path = "objkit-macros", version = "^0", default-features = false }

[package]
name = "objkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = """
A toolkit providing convenient abstractions for trait object operations that aren't supported by rust's trait system directly, such as cloning, comparison, and conversion
"""
license = "MPL-2.0"
readme = "README.md"
keywords = ["trait-objects", "dyn-traits", "object-safety", "vtable", "type-erasure"]
exclude = [".idea/", "target/"]
categories = ["rust-patterns", "development-tools", "data-structures"]
documentation = "https://docs.rs/objkit"
homepage = "https://github.com/orgrinrt/objkit"
repository = "https://github.com/orgrinrt/objkit"

[dependencies]
objkit-macros.workspace = true

[features]
default = ["std"]
std = ["objkit-macros/std"]
no_std = ["objkit-macros/no_std"]
# Implies `no_std`. `clone_box` is gone under it, because a boxed clone is exactly what an
# allocator is for; `obj_eq` keeps comparing `&dyn Trait` and loses only the two impls over
# `Box<dyn Trait>`; `as_any` and `as_super` are unaffected.
no_alloc = ["no_std", "objkit-macros/no_alloc"]


[dev-dependencies]
# For `examples/a_plugin_registry.rs`, which is the one example here that is about several of
# these crates working together rather than about this one. Dev-only: nothing in the library
# reaches for either.
highroller = { git = "https://github.com/orgrinrt/highroller.git", branch = "dev" }
str_extensions = { git = "https://github.com/orgrinrt/str_extensions.git", branch = "dev" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "obj_eq"
harness = false
