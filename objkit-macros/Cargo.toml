[package]
name = "objkit-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["macro", "trait-object", "downcast", "clone", "dyn"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers", "no-std"]
description = """
The procedural macro implementations behind objkit: the clone_box, obj_eq, as_super and as_any trait object attributes
"""
license = "MPL-2.0"
homepage = "https://github.com/orgrinrt/objkit"
repository = "https://github.com/orgrinrt/objkit"

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn.workspace = true
proc-macro2.workspace = true
include_proc_macro.workspace = true

[features]
# Building this crate on its own used to reach neither `std_box` nor `alloc_box` and stop at
# the `compile_error!` in `box_path`, so `cargo build -p objkit-macros` failed. The parent
# crate always passed one, which is why it went unnoticed.
default = ["std"]
std_box = []
alloc_box = []
# the two main variants
std = ["std_box"]
no_std = ["alloc_box"]
# Implies `no_std`. Compiles out what cannot exist without an allocator: `clone_box` is a
# boxed clone and refuses, and `obj_eq` keeps its reference impls and drops the two over
# `Box<dyn Trait>`, which were a convenience over them. `as_any` and `as_super` are
# unaffected, because neither ever needed one.
no_alloc = ["no_std"]
